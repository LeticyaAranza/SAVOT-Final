{% load static %}

<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    {% if GA_MEASUREMENT_ID %}
    <!-- Google Analytics 4 -->
    <script async src="https://www.googletagmanager.com/gtag/js?id={{ GA_MEASUREMENT_ID }}"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag("js", new Date());
        gtag("config", "{{ GA_MEASUREMENT_ID }}");
    </script>
    {% endif %}

    <title>{% block title %}CEFET-MG{% endblock %}</title>

    <link rel="stylesheet" href="{% static 'cursos/css/base.css' %}">
    {% block extra_css %}{% endblock %}
</head>

<body>

    <header class="header" id="header">

        <div class="logo">
            <h1>CEFET-MG</h1>
        </div>

        <button class="menu-toggle" id="menu-toggle" type="button" aria-label="Abrir menu" aria-expanded="false">
            <span></span>
            <span></span>
            <span></span>
        </button>

        <nav class="menu" id="menu">
            <ul>

                <li>
                    <a href="{% url 'home' %}">Quem Somos</a>
                </li>

                <li>
                    <a href="{% url 'edificacoes' %}">Edificações</a>
                </li>

                <li>
                    <a href="{% url 'informatica' %}">Informática</a>
                </li>

                <li>
                    <a href="{% url 'mecatronica' %}">Mecatrônica</a>
                </li>

            </ul>
        </nav>

    </header>

    <main>
        {% block content %}{% endblock %}
    </main>

    <script src="{% static 'cursos/js/header-scroll.js' %}"></script>
    {% block extra_js %}{% endblock %}

</body>

</html>
